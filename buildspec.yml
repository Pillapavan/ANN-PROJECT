version: 0.2

env:
  parameter-store:
    DOCKER_USERNAME: /ann-project/dockerhub/username
    DOCKER_TOKEN: /ann-project/dockerhub/token

phases:
  install:
    runtime-versions:
      python: 3.11

  pre_build:
    commands:
      - pip install -r requirements.txt
      - echo "$DOCKER_TOKEN" | docker login docker.io -u "$DOCKER_USERNAME" --password-stdin

  build:
    commands:
      - docker build -t "$DOCKER_USERNAME/ann-project:latest" .

  post_build:
    commands:
      - docker push "$DOCKER_USERNAME/ann-project:latest"

artifacts:
  files:
    - appspec.yml
    - scripts/**/*
