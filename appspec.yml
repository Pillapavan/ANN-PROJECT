version: 0.0
os: linux

files:
  - source: appspec.yml
    destination: /home/ubuntu/ann-project

  - source: scripts/
    destination: /home/ubuntu/ann-project/scripts

hooks:

  ApplicationStop:
    - location: scripts/stop_application.sh
      timeout: 300
      runas: ubuntu

  ApplicationStart:
    - location: scripts/start_application.sh
      timeout: 300
      runas: ubuntu

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 300
      runas: ubuntu